<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>BRITANNIA</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <section id="start-screen" class="screen">
      <div class="card">
        <h1>BRITANNIA</h1>
        <p>You'll be shown the names of 10 places. Click on the map to guess where each one is. Lowest total error distance wins.</p>
        <div class="difficulty-group" role="radiogroup" aria-label="Difficulty">
          <button type="button" class="difficulty-btn" data-difficulty="easy">
            <span class="d-label">Easy</span>
            <span class="d-desc">Major cities (population &gt; 150k)</span>
          </button>
          <button type="button" class="difficulty-btn selected" data-difficulty="medium">
            <span class="d-label">Medium</span>
            <span class="d-desc">Towns &amp; cities (population &gt; 50k)</span>
          </button>
          <button type="button" class="difficulty-btn" data-difficulty="hard">
            <span class="d-label">Hard</span>
            <span class="d-desc">All places (population &gt; 15k)</span>
          </button>
        </div>
        <div class="overlay-group">
          <label class="overlay-btn">
            <input type="checkbox" id="show-rivers" checked />
            <span class="overlay-icon rivers-icon"></span>
            <span>Rivers</span>
          </label>
          <label class="overlay-btn">
            <input type="checkbox" id="show-motorways" checked />
            <span class="overlay-icon motorways-icon"></span>
            <span>Motorways</span>
          </label>
        </div>
        <button id="start-btn" class="primary">Play</button>
      </div>
    </section>

    <section id="game-screen" class="screen hidden">
      <header id="game-header">
        <div class="round-info">
          <span id="round-counter">1 / 10</span>
          <span id="total-so-far">0 km</span>
        </div>
        <div class="prompt" id="prompt-playing">
          <span class="prompt-label">Find:</span>
          <span class="prompt-main">
            <span id="place-name">—</span>
            <span id="place-population" class="place-population"></span>
          </span>
        </div>
        <div class="prompt hidden" id="prompt-results">
          <span class="prompt-label">Final score</span>
          <span class="prompt-main"><span id="final-total">—</span> km</span>
        </div>
      </header>
      <div id="map-wrap">
        <div id="map" role="application" aria-label="Map of the United Kingdom"></div>
        <div id="results-overlay" class="hidden">
          <div class="results-card">
            <h2>Results</h2>
            <ol id="results-list"></ol>
            <div class="results-total">
              <span>Total</span>
              <span id="results-total-km">— km</span>
            </div>
            <div class="results-actions">
              <button id="overlay-view-map-btn" class="primary">View map</button>
              <button id="overlay-back-menu-btn" class="secondary">Back to menu</button>
            </div>
          </div>
        </div>
      </div>
      <footer id="game-footer">
        <div id="result-readout" class="hidden">
          <span id="distance-readout">— km</span>
        </div>
        <p id="hint" class="hint">Tap the map to place your guess</p>
        <button id="next-btn" class="primary hidden">Next</button>
        <button id="view-results-btn" class="primary hidden">View results</button>
        <button id="back-menu-btn" class="secondary hidden">Back to menu</button>
        <button id="quit-btn" class="ghost hidden">Quit</button>
      </footer>
    </section>

    <div id="confirm-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-card">
        <h2 id="confirm-title">Quit?</h2>
        <p>Your current game progress will be lost.</p>
        <div class="modal-actions">
          <button id="confirm-quit-btn" class="primary">Quit</button>
          <button id="confirm-cancel-btn" class="secondary">Cancel</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>
  <script src="game.js"></script>
</body>
</html>
