<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Britain Guessr</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <section id="start-screen" class="screen">
      <div class="card">
        <h1>Britain Guessr</h1>
        <p>You'll be shown 10 UK places. Click on the map to guess where each one is. Lower total distance wins.</p>
        <button id="start-btn" class="primary">Play</button>
      </div>
    </section>

    <section id="game-screen" class="screen hidden">
      <header id="game-header">
        <div class="round-info">
          <span id="round-counter">1 / 10</span>
          <span id="total-so-far">0 km</span>
        </div>
        <div class="prompt">
          <span class="prompt-label">Find:</span>
          <span id="place-name">—</span>
        </div>
      </header>
      <div id="map" role="application" aria-label="Map of the United Kingdom"></div>
      <footer id="game-footer">
        <div id="result-readout" class="hidden">
          <span id="distance-readout">— km</span>
        </div>
        <button id="next-btn" class="primary hidden">Next</button>
        <p id="hint" class="hint">Tap the map to place your guess</p>
      </footer>
    </section>

    <section id="end-screen" class="screen hidden">
      <div class="card">
        <h1>Final score</h1>
        <p class="total"><span id="final-total">—</span> km</p>
        <ol id="breakdown"></ol>
        <button id="restart-btn" class="primary">Play again</button>
      </div>
    </section>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>
  <script src="game.js"></script>
</body>
</html>
